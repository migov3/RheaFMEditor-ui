<ul>
    <h3>Semantic metrics</h3>
</ul>
<mat-spinner class="spinner" *ngIf="uploading"></mat-spinner>
<table *ngIf="!uploading" mat-table [dataSource]="semanticMetrics">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Operation </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
  
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> Result </th>
      <td mat-cell *matCellDef="let element"> {{element.value}} </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="['name', 'value']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'value']"></tr>
</table>
