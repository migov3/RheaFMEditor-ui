<h2 mat-dialog-title>Login</h2>
<div mat-dialog-content>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
        <mat-form-field class="full-width">
            <mat-label>Username</mat-label>
            <input matInput type="text" formControlName="username" required name="username" placeholder="Username">
        </mat-form-field>
        <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" required name="password" placeholder="Password">
        </mat-form-field>
        <mat-error>{{ loginErrorMsg }}</mat-error>
        <mat-dialog-actions align="end">
            <button mat-button color="primary" type="submit">Login</button>
            <button mat-button mat-dialog-close>Cancel</button>
        </mat-dialog-actions>
    </form>
</div>
