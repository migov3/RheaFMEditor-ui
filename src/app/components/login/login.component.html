<div class="login">
    <div class="buttons" *ngIf="!logged">
        <div class="button-container">
            <button mat-flat-button color="primary" (click)="openLogin()">Login</button>
        </div>
        <div class="button-container">
            <button mat-flat-button class="gray" (click)="openReg()">Register</button>
        </div>
    </div>
    <div *ngIf="logged">
        <p>Welcome <b>{{ currentUsername }}</b></p>
        <form (submit)="logout()">
            <button mat-flat-button class="gray" type="submit">Logout</button>
        </form>
    </div>
</div>
